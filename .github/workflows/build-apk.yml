name: Build PureVideo APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.6
          cache: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Apply All Fixes Automatically
        run: |
          echo "=== 1. Aktualizacja LibResolveURL (VOE, Streamtape) ==="
          rm -rf resolver/LibResolveURL
          git clone --depth 1 https://github.com/Gujal00/ResolveURL.git resolver/LibResolveURL
          mkdir -p app
          python3 -c "import shutil; shutil.make_archive('app/app', 'zip', 'resolver')"

          echo "=== 2. Naprawa domeny Ekino (ekino.ws) ==="
          sed -i 's|https://ekino-tv.pl|https://ekino.ws|g' lib/core/utils/supported_enum.dart

          echo "=== 3. Naprawa okna Cloudflare dla Filmana ==="
          cat << 'EOF' > patch_cf.py
          p = 'lib/core/services/webview_service.dart'
          with open(p, 'r', encoding='utf-8') as f:
              c = f.read()
          c = c.replace('transparentBackground: true', 'transparentBackground: false')
          c = c.replace('incognito: true', 'incognito: false')
          c = c.replace('clearCache: true', 'clearCache: false')
          c = c.replace('; wv', '')
          c = c.replace('Colors.transparent', 'const Color(0xFF1E293B)')
          with open(p, 'w', encoding='utf-8') as f:
              f.write(c)
          EOF
          python3 patch_cf.py
          rm -f patch_cf.py

          echo "=== 4. Dostosowanie Android SDK i minSdk dla Python NDK ==="
          sed -i 's/compileSdk = 36/compileSdk = 35/g' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
          sed -i '/ndkVersion/d' android/app/build.gradle.kts

      - name: Setup Signing Key
        run: |
          KEY_PATH="$GITHUB_WORKSPACE/android/app/release.keystore"
          keytool -genkey -v -keystore "$KEY_PATH" -alias purevideo -storepass purevideopass -keypass purevideopass -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PureVideo,O=App,C=PL"
          cat << EOF > android/key.properties
          storePassword=purevideopass
          keyPassword=purevideopass
          keyAlias=purevideo
          storeFile=$KEY_PATH
          EOF

      - name: Install Flutter Packages
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --verbose

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureVideo-Fixed-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
