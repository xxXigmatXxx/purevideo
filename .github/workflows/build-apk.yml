name: Build PureVideo APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to Last Working Commit & Apply Fixes
        run: |
          echo "=== 1. Cofnięcie do ostatniego działającego commita (61de1c3) ==="
          git checkout -f 61de1c394e8a91fb54b64a650c2d4ca8b4b0cc8e

          echo "=== 2. Naprawa domeny Ekino (ekino.ws) ==="
          sed -i 's|https://ekino-tv.pl|https://ekino.ws|g' lib/core/utils/supported_enum.dart

          echo "=== 3. Naprawa okna Cloudflare dla Filmana ==="
          cat << 'EOF' > patch_cf.py
          p = 'lib/core/services/webview_service.dart'
          with open(p, 'r', encoding='utf-8') as f:
              c = f.read()
          c = c.replace('transparentBackground: true', 'transparentBackground: false')
          c = c.replace('incognito: true', 'incognito: false')
          c = c.replace('clearCache: true', 'clearCache: false')
          c = c.replace('; wv', '')
          c = c.replace('Colors.transparent', 'const Color(0xFF1E293B)')
          with open(p, 'w', encoding='utf-8') as f:
              f.write(c)
          EOF
          python3 patch_cf.py
          rm -f patch_cf.py

          echo "=== 4. Dodanie scrapera VOE i aktualizacja podpisu APK ==="
          cat << 'EOF' > lib/core/video_hosts/scrapers/voe_scraper.dart
          import 'dart:convert';
          import 'package:dio/dio.dart';
          import 'package:flutter/material.dart';
          import 'package:purevideo/core/video_hosts/video_host_scraper.dart';

          class VoeScraper extends VideoHostScraper {
            final Dio _dio;
            VoeScraper(this._dio);

            @override
            String get name => 'VOE';

            @override
            List<String> get domains => [
                  'voe.sx', 'voe.to', 'voe.st', 'voe.eu', 'voe.la',
                  'alejandrocenturyoil.com', 'lukecomparetwo.com',
                  'rebeccacallbase.com', 'loriwithinfamily.com',
                  'roberteachfinal.com', 'erikcoldperson.com',
                  'jasminetesttry.com', 'heidistartneck.com',
                  'graceaddresscommunity.com', 'monorhinous.com',
                  'valeriewantdo.com', 'walterprettytheir.com'
                ];

            @override
            Future<VideoSource?> getVideoSource(String url, String lang, String quality) async {
              try {
                var response = await _dio.get(url);
                var html = response.data.toString();
                final redirectMatch = RegExp(r"window\.location\.href\s*=\s*['\"](https?://[^'\"]+)['\"]").firstMatch(html);
                if (redirectMatch != null) {
                  url = redirectMatch.group(1)!;
                  response = await _dio.get(url);
                  html = response.data.toString();
                }
                final hlsMatch = RegExp(r"['\"]hls['\"]\s*:\s*['\"]([^'\"]+)['\"]").firstMatch(html);
                if (hlsMatch != null) {
                  var hls = hlsMatch.group(1)!;
                  if (!hls.startsWith('http')) {
                    try { hls = utf8.decode(base64Decode(hls)); } catch (_) {}
                  }
                  if (hls.startsWith('http')) {
                    return VideoSource(
                      url: hls,
                      lang: lang,
                      quality: quality,
                      host: name,
                      headers: {'Referer': url, 'User-Agent': 'Mozilla/5.0'},
                    );
                  }
                }
                return null;
              } catch (e) {
                debugPrint('VOE error: $e');
                return null;
              }
            }
          }
          EOF

          cat << 'EOF' > patch_reg.py
          p = 'lib/di/video_hosts_container.dart'
          with open(p, 'r', encoding='utf-8') as f:
              c = f.read()
          c = "import 'package:purevideo/core/video_hosts/scrapers/voe_scraper.dart';\n" + c
          c = c.replace('registry.registerScraper(StreamtapeScraper(dio));', 'registry.registerScraper(StreamtapeScraper(dio));\n    registry.registerScraper(VoeScraper(dio));')
          with open(p, 'w', encoding='utf-8') as f:
              f.write(c)
          EOF
          python3 patch_reg.py
          rm -f patch_reg.py

          cat << 'EOF' > patch_gradle.py
          with open("android/app/build.gradle.kts", "r") as f:
              c = f.read()
          c = c.replace('signingConfig = signingConfigs.getByName("release")', 'signingConfig = signingConfigs.getByName("debug")')
          c = c.replace('keyAlias = keystoreProperties["keyAlias"] as String', 'keyAlias = (keystoreProperties["keyAlias"] as String?) ?: "debug"')
          c = c.replace('keyPassword = keystoreProperties["keyPassword"] as String', 'keyPassword = (keystoreProperties["keyPassword"] as String?) ?: "debug"')
          c = c.replace('storePassword = keystoreProperties["storePassword"] as String', 'storePassword = (keystoreProperties["storePassword"] as String?) ?: "debug"')
          with open("android/app/build.gradle.kts", "w") as f:
              f.write(c)
          EOF
          python3 patch_gradle.py
          rm -f patch_gradle.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.6

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureVideo-Fixed-APK
          path: build/app/outputs/flutter-apk/app-release.apk