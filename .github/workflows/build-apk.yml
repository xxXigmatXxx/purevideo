# 3. video_source_repository.dart - remove dio.head rejection
with open('lib/data/repositories/video_source_repository.dart', 'w') as f:
    f.write('''import 'package:flutter/material.dart';
import 'package:purevideo/core/video_hosts/video_host_registry.dart';
import 'package:purevideo/core/video_hosts/video_host_scraper.dart';
import 'package:purevideo/data/models/movie_model.dart';
import 'package:purevideo/di/injection_container.dart';

class VideoSourceRepository {
  final VideoHostRegistry _hostRegistry = getIt<VideoHostRegistry>();

  Future<MovieDetailsModel> scrapeVideoUrls(MovieDetailsModel movie) async {
    if (movie.videoUrls == null || movie.videoUrls!.isEmpty) return movie;

    final futures = movie.videoUrls!.map((hostLink) async {
      try {
        final scraper = _hostRegistry.getScraperForUrl(hostLink.url);
        if (scraper == null) return null;

        final videoSource = await scraper
            .getVideoSource(hostLink.url, hostLink.lang, hostLink.quality)
            .timeout(const Duration(seconds: 10), onTimeout: () => null);

        if (videoSource == null || videoSource.url.isEmpty) return null;
        return videoSource;
      } catch (e) {
        debugPrint('Error scraping ${hostLink.url}: $e');
        return null;
      }
    }).toList();

    final results = await Future.wait(futures);
    return movie.copyWith(directUrls: results.whereType<VideoSource>().toList());
  }
}
''')

# 4. VidNeo scraper (obejrzyj.to)
with open('lib/core/video_hosts/scrapers/vidneo_scraper.dart', 'w') as f:
    f.write('''import 'package:dio/dio.dart';
import 'package:flutter/foundation.dart';
import 'package:purevideo/core/video_hosts/video_host_scraper.dart';

class VidNeoScraper extends VideoHostScraper {
  final Dio _dio;
  VidNeoScraper(this._dio);

  @override
  String get name => 'VidNeo';

  @override
  List<String> get domains => ['vidneo.cc', 'vidneo.to', 'vidneo.net'];

  @override
  Future<VideoSource?> getVideoSource(String url, String lang, String quality) async {
    try {
      final origin = '${Uri.parse(url).scheme}://${Uri.parse(url).host}';
      final resp = await _dio.get(url, options: Options(headers: {'Referer': 'https://obejrzyj.to/'}));
      final m = RegExp(r'(?:src\\\\?":\\\\?"|src":")([^"\\\\]+\\.m3u8[^"\\\\]*)').firstMatch(resp.data.toString());
      if (m != null && m.group(1) != null) {
        var s = m.group(1)!.replaceAll(r'\\/', '/');
        if (s.startsWith('/')) s = '$origin$s';
        return VideoSource(url: s, lang: lang, quality: quality, host: name, headers: {'Referer': url});
      }
    } catch (e) {
      debugPrint('VidNeo error: $e');
    }
    return null;
  }
}
''')

# 5. Vidara scraper (obejrzyj.to)
with open('lib/core/video_hosts/scrapers/vidara_scraper.dart', 'w') as f:
    f.write('''import 'dart:convert';
import 'package:dio/dio.dart';
import 'package:flutter/foundation.dart';
import 'package:purevideo/core/video_hosts/video_host_scraper.dart';

class VidaraScraper extends VideoHostScraper {
  final Dio _dio;
  VidaraScraper(this._dio);

  @override
  String get name => 'Vidara';

  @override
  List<String> get domains => ['vidara.to', 'streamix.so', 'stmix.io'];

  @override
  Future<VideoSource?> getVideoSource(String url, String lang, String quality) async {
    try {
      final origin = '${Uri.parse(url).scheme}://${Uri.parse(url).host}';
      final id = Uri.parse(url).pathSegments.where((s) => s.isNotEmpty).last;
      final resp = await _dio.post('$origin/api/stream',
          data: jsonEncode({'filecode': id, 'device': 'web'}),
          options: Options(headers: {'Referer': url, 'Origin': origin, 'Content-Type': 'application/json'}));
      final data = resp.data is String ? jsonDecode(resp.data) : resp.data;
      if (data is Map && data['streaming_url'] != null) {
        return VideoSource(url: data['streaming_url'].toString(), lang: lang, quality: quality, host: name, headers: {'Referer': '$origin/'});
      }
    } catch (e) {
      debugPrint('Vidara error: $e');
    }
    return null;
  }
}
''')

# 6. VOE scraper (2026 LUT + base64)
with open('lib/core/video_hosts/scrapers/voe_scraper.dart', 'w') as f:
    f.write('''import 'dart:convert';
import 'package:dio/dio.dart';
import 'package:flutter/foundation.dart';
import 'package:purevideo/core/video_hosts/video_host_scraper.dart';

class VoeScraper extends VideoHostScraper {
  final Dio _dio;
  VoeScraper(this._dio);

  @override
  String get name => 'VOE';

  @override
  List<String> get domains => [
        'voe.sx', 'voe-unblock.com', 'voe-unblock.net', 'voeunblock.com',
        'jonathansociallike.com', 'lukecomparetwo.com', 'smoki.cc', 'ogladaj.me',
        'wolfdyslectic.com', 'valeronevijao.com', 'goofy-banana.com',
        'cristianefrog.com', 'alejandrocentury.com'
      ];

  @override
  Future<VideoSource?> getVideoSource(String url, String lang, String quality) async {
    try {
      var currentUrl = url;
      var resp = await _dio.get(currentUrl);
      var html = resp.data.toString();
      final redir = RegExp(r"window\\.location\\.href\\s*=\\s*['\\\"]([^'\\\"]+)['\\\"]").firstMatch(html);
      if (redir != null) {
        currentUrl = redir.group(1)!;
        resp = await _dio.get(currentUrl, options: Options(headers: {'Referer': url}));
        html = resp.data.toString();
      }
      final jsonScript = RegExp(r'json">\\\\["([^"]+)"\\\\]</script>\\\\s*<script\\\\s*src="([^"]+)"').firstMatch(html);
      if (jsonScript != null) {
        final ct = jsonScript.group(1)!;
        final sUrl = Uri.parse(currentUrl).resolve(jsonScript.group(2)!).toString();
        final sHtml = (await _dio.get(sUrl, options: Options(headers: {'Referer': currentUrl}))).data.toString();
        final repl = RegExp(r"(\\\\[(?:'\\\\W{2}'[,\\\\]]){1,9})").firstMatch(sHtml);
        if (repl != null) {
          final luts = repl.group(1)!.substring(2, repl.group(1)!.length - 2).split("','");
          final buf = StringBuffer();
          for (int i = 0; i < ct.length; i++) {
            int x = ct.codeUnitAt(i);
            if (x > 64 && x < 91) buf.writeCharCode((x - 52) % 26 + 65);
            else if (x > 96 && x < 123) buf.writeCharCode((x - 84) % 26 + 97);
            else buf.writeCharCode(x);
          }
          var txt = buf.toString();
          for (final p in luts) txt = txt.replaceAll(p, '');
          final dec1 = latin1.decode(base64Decode(base64.normalize(txt)));
          final shifted = String.fromCharCodes(dec1.codeUnits.map((c) => c - 3)).split('').reversed.join();
          final data = jsonDecode(utf8.decode(base64Decode(base64.normalize(shifted)), allowMalformed: true));
          final stream = (data['source'] ?? data['file'] ?? data['direct_access_url'])?.toString();
          if (stream != null && stream.isNotEmpty) {
            return VideoSource(url: stream, lang: lang, quality: quality, host: name, headers: {'Referer': currentUrl});
          }
        }
      }
      for (final p in [r"['\\\"]hls['\\\"]\\\\s*:\\\\s*['\\\"]([^'\\\"]+)['\\\"]", r"['\\\"]mp4['\\\"]\\\\s*:\\\\s*['\\\"]([^'\\\"]+)['\\\"]"]) {
        final m = RegExp(p).firstMatch(html);
        if (m != null) {
          var cand = m.group(1)!;
          if (!cand.startsWith('http')) {
            try { cand = utf8.decode(base64Decode(base64.normalize(cand))); } catch (_) {}
          }
          if (cand.startsWith('http')) {
            return VideoSource(url: cand, lang: lang, quality: quality, host: name, headers: {'Referer': currentUrl});
          }
        }
      }
    } catch (e) {
      debugPrint('VOE error: $e');
    }
    return null;
  }
}
''')

# 7. video_hosts_container.dart registration
with open('lib/di/video_hosts_container.dart', 'w') as f:
    f.write('''import 'dart:io';
import 'package:dio/dio.dart';
import 'package:dio/io.dart';
import 'package:purevideo/core/video_hosts/scrapers/doodstream_scraper.dart';
import 'package:purevideo/core/video_hosts/scrapers/ekino_scraper.dart';
import 'package:purevideo/core/video_hosts/scrapers/filemoon_scraper.dart';
import 'package:purevideo/core/video_hosts/scrapers/kinoger_scraper.dart';
import 'package:purevideo/core/video_hosts/scrapers/lulustream_scraper.dart';
import 'package:purevideo/core/video_hosts/scrapers/streamruby_scraper.dart';
import 'package:purevideo/core/video_hosts/scrapers/streamtape_scraper.dart';
import 'package:purevideo/core/video_hosts/scrapers/vidara_scraper.dart';
import 'package:purevideo/core/video_hosts/scrapers/vidneo_scraper.dart';
import 'package:purevideo/core/video_hosts/scrapers/vidoza_scraper.dart';
import 'package:purevideo/core/video_hosts/scrapers/voe_scraper.dart';
import 'package:purevideo/core/video_hosts/scrapers/vtube_scraper.dart';
import 'package:purevideo/core/video_hosts/video_host_registry.dart';

class VideoHostsContainer {
  static void registerVideoScrapers(VideoHostRegistry registry) {
    final Dio dio = Dio(
      BaseOptions(
        connectTimeout: const Duration(seconds: 8),
        receiveTimeout: const Duration(seconds: 8),
        sendTimeout: const Duration(seconds: 8),
        validateStatus: (status) => true,
      ),
    );
    final ioc = HttpClient();
    ioc.badCertificateCallback = (X509Certificate cert, String host, int port) => true;
    dio.httpClientAdapter = IOHttpClientAdapter(createHttpClient: () => ioc);

    registry.registerScraper(VidNeoScraper(dio));
    registry.registerScraper(VidaraScraper(dio));
    registry.registerScraper(VoeScraper(dio));
    registry.registerScraper(StreamtapeScraper(dio));
    registry.registerScraper(VidozaScraper(dio));
    registry.registerScraper(DoodStreamScraper(dio));
    registry.registerScraper(VtubeScraper(dio));
    registry.registerScraper(KinoGerScraper(dio));
    registry.registerScraper(LuluStreamScraper(dio));
    registry.registerScraper(StreamrubyScraper(dio));
    registry.registerScraper(EkinoScraper());
    registry.registerScraper(FileMoonScraper(dio));
  }
}
''')

# 8. video_host_registry.dart fallback to VOE for /e/
with open('lib/core/video_hosts/video_host_registry.dart', 'w') as f:
    f.write('''import 'package:collection/collection.dart';
import 'package:purevideo/core/video_hosts/video_host_scraper.dart';

class VideoHostRegistry {
  final List<VideoHostScraper> _scrapers = [];

  void registerScraper(VideoHostScraper scraper) {
    _scrapers.add(scraper);
  }

  VideoHostScraper? getScraperForUrl(String url) {
    final exact = _scrapers.firstWhereOrNull((s) => s.canHandle(url));
    if (exact != null) return exact;
    if (url.contains('/e/')) {
      return _scrapers.firstWhereOrNull((s) => s.name == 'VOE');
    }
    return null;
  }

  bool isHostSupported(String url) => getScraperForUrl(url) != null;
  List<VideoHostScraper> get scrapers => List.unmodifiable(_scrapers);
}
''')
