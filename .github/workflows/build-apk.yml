name: Build PureVideo APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Filman Login and Player Fixes
        run: |
          echo "=== 1. Reset do stabilnej bazy 61de1c3 ==="
          git checkout -f 61de1c394e8a91fb54b64a650c2d4ca8b4b0cc8e

          echo "=== 2. Pobieranie naprawionego logowania Filman.cc oraz dekodera z 0f94513 ==="
          git checkout 0f94513fb6f5ceb0e32b0a32673586cc3e6f5ec2 -- \
            lib/data/models/auth_model.dart \
            lib/data/repositories/filman/filman_auth_repository.dart \
            lib/data/repositories/filman/filman_dio_factory.dart \
            lib/data/repositories/filman/filman_movie_repository.dart \
            lib/data/repositories/filman/filman_search_repository.dart

          echo "=== 3. Poprawka odtwarzacza i dekodowania zrodel Filmana ==="
          python3 -c "p='lib/data/repositories/filman/filman_movie_repository.dart'; s=open(p).read(); s=s.replace('link = (utf8.decode(decoded));', '''final d = utf8.decode(decoded).trim(); if (d.startsWith(\"{\")) { try { final dynamic m = jsonDecode(d); link = (m is Map ? (m[\"src\"] ?? m[\"url\"] ?? d) : d).toString(); } catch (_) { link = d; } } else { link = d; } if (link.startsWith(\"//\")) link = \"https:\" + link;''').replace(\"return '';\", 'return tempUrl;'); open(p,'w').write(s)"
          python3 -c "p='lib/presentation/player/bloc/player_bloc.dart'; s=open(p).read(); s=s.replace('// await _videoSourceRepository.scrapeVideoUrls(_movie!); we already done this in movie details bloc', 'if (movieDetails.directUrls == null || movieDetails.directUrls!.isEmpty) { movieDetails = await _videoSourceRepository.scrapeVideoUrls(_movie!); }'); open(p,'w').write(s)"
          python3 -c "p='lib/data/repositories/video_source_repository.dart'; s='''import \"package:flutter/material.dart\";\nimport \"package:purevideo/core/video_hosts/video_host_registry.dart\";\nimport \"package:purevideo/core/video_hosts/video_host_scraper.dart\";\nimport \"package:purevideo/data/models/movie_model.dart\";\nimport \"package:purevideo/di/injection_container.dart\";\n\nclass VideoSourceRepository {\n  final VideoHostRegistry _hostRegistry = getIt<VideoHostRegistry>();\n\n  Future<MovieDetailsModel> scrapeVideoUrls(MovieDetailsModel movie) async {\n    if (movie.videoUrls == null) return movie;\n    final videoSources = <VideoSource>[];\n    for (final hostLink in movie.videoUrls!) {\n      if (hostLink.url.isEmpty) continue;\n      final scraper = _hostRegistry.getScraperForUrl(hostLink.url);\n      if (scraper == null) {\n        final uri = Uri.tryParse(hostLink.url);\n        final hostName = (uri != null && uri.host.isNotEmpty) ? uri.host : \"Wideo\";\n        videoSources.add(VideoSource(url: hostLink.url, lang: hostLink.lang, quality: hostLink.quality, host: hostName));\n        continue;\n      }\n      try {\n        final videoSource = await scraper.getVideoSource(hostLink.url, hostLink.lang, hostLink.quality);\n        if (videoSource != null) {\n          videoSources.add(videoSource);\n        } else {\n          videoSources.add(VideoSource(url: hostLink.url, lang: hostLink.lang, quality: hostLink.quality, host: scraper.name));\n        }\n      } catch (e) {\n        videoSources.add(VideoSource(url: hostLink.url, lang: hostLink.lang, quality: hostLink.quality, host: scraper.name));\n      }\n    }\n    return movie.copyWith(directUrls: videoSources);\n  }\n}\n'''; open(p,'w').write(s)"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore android/app/keystore.jks -alias purevideo -storepass purevideopass -keypass purevideopass -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PureVideo,O=App,C=PL"
          echo "storePassword=purevideopass" > android/key.properties
          echo "keyPassword=purevideopass" >> android/key.properties
          echo "keyAlias=purevideo" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.6

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          set +e
          flutter build apk --release 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::BUILD_ERROR_LOG: $(grep -E 'Error:|FAILURE:|What went wrong:|Exception' -A 5 build_log.txt | tr '\n' ' ')"
            exit $EXIT_CODE
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureVideo-Fixed-APK
          path: build/app/outputs/flutter-apk/app-release.apk
