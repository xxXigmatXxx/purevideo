name: Build PureVideo APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild app.zip (LibResolveURL + deps) & Apply Filman + Player Fixes
        run: |
          python3 - << 'PYEOF'
          import os, shutil, zipfile, hashlib, urllib.request, json, io, re

          print('=== 1. Patching android/app/build.gradle.kts (minSdk=24, compileSdk=36) ===')
          p_gradle = 'android/app/build.gradle.kts'
          s_gradle = open(p_gradle, encoding='utf-8').read()
          s_gradle = s_gradle.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          s_gradle = s_gradle.replace('ndkVersion = "28.2.13676358"', 'ndkVersion = "27.0.12077973"')
          open(p_gradle, 'w', encoding='utf-8').write(s_gradle)

          print('=== 2. Rebuilding app/app.zip and app/app.zip.hash ===')
          work = '/tmp/_app_zip_build'
          shutil.rmtree(work, ignore_errors=True)
          os.makedirs(work, exist_ok=True)

          with zipfile.ZipFile('app/app.zip', 'r') as z:
              z.extractall(work)

          for root, dirs, files in os.walk(work, topdown=False):
              for f in files:
                  if f.endswith(('.pyc', '.pyo')):
                      os.remove(os.path.join(root, f))
              for d in dirs:
                  if d in ('__pycache__', '.git', '.dart_tool'):
                      shutil.rmtree(os.path.join(root, d), ignore_errors=True)

          print('=== 2a. Updating LibResolveURL from upstream Gujal00/ResolveURL ===')
          rurl_zip = '/tmp/resolveurl_master.zip'
          rurl_extract = '/tmp/resolveurl_latest'
          shutil.rmtree(rurl_extract, ignore_errors=True)
          urllib.request.urlretrieve('https://github.com/Gujal00/ResolveURL/archive/refs/heads/master.zip', rurl_zip)
          with zipfile.ZipFile(rurl_zip, 'r') as z:
              z.extractall(rurl_extract)
          src_rurl = os.path.join(rurl_extract, 'ResolveURL-master', 'script.module.resolveurl')
          dst_rurl = os.path.join(work, 'LibResolveURL', 'script.module.resolveurl')
          if os.path.exists(src_rurl):
              shutil.rmtree(dst_rurl, ignore_errors=True)
              shutil.copytree(src_rurl, dst_rurl)
              print('Successfully updated script.module.resolveurl from upstream!')

          # Fix xbmcaddon.py circular import cache bug (_xml_defaults stuck at 3 items)
          p_xbmcaddon = os.path.join(work, 'LibResolveURL', 'libresolveurl', '_kodi_stubs', 'xbmcaddon.py')
          if os.path.exists(p_xbmcaddon):
              s_xa = open(p_xbmcaddon, encoding='utf-8').read()
              s_xa = s_xa.replace('if _xml_defaults is None:', 'if _xml_defaults is None or len(_xml_defaults) < 100:')
              s_xa = s_xa.replace('return ""', 'if key.endswith("_enabled") or key in ("allow_popups", "allow_universal"): return "true"\n            if key.endswith("_priority"): return "100"\n            return ""')
              open(p_xbmcaddon, 'w', encoding='utf-8').write(s_xa)

          # Patch hmf.py to skip redundant __test_stream HTTP check (faster + preserves single-use stream tokens)
          p_hmf = os.path.join(dst_rurl, 'lib', 'resolveurl', 'hmf.py')
          if os.path.exists(p_hmf):
              s_hmf = open(p_hmf, encoding='utf-8').read()
              s_hmf = s_hmf.replace('status, mimetype = self.__test_stream(stream_url)', 'status, mimetype = True, ""')
              open(p_hmf, 'w', encoding='utf-8').write(s_hmf)

          # Patch net.py default timeout from 30s to 8s so dead hosts fail fast
          p_net = os.path.join(dst_rurl, 'lib', 'resolveurl', 'lib', 'net.py')
          if os.path.exists(p_net):
              s_net = open(p_net, encoding='utf-8').read()
              s_net = s_net.replace('timeout=30', 'timeout=8')
              open(p_net, 'w', encoding='utf-8').write(s_net)

          # Patch voesx.py to always prefer_hls (avoids int() sort crash and picks HLS directly)
          p_voe = os.path.join(dst_rurl, 'lib', 'resolveurl', 'plugins', 'voesx.py')
          if os.path.exists(p_voe):
              s_voe = open(p_voe, encoding='utf-8').read()
              s_voe = s_voe.replace("if self.get_setting('prefer_hls') == 'true':", "if True:")
              open(p_voe, 'w', encoding='utf-8').write(s_voe)

          open(os.path.join(work, '.purevideo_v41'), 'w', encoding='utf-8').write('v41')

          # Patch byse.py PoW timeout from 45s to 8s
          p_byse = os.path.join(dst_rurl, 'lib', 'resolveurl', 'plugins', 'byse.py')
          if os.path.exists(p_byse):
              s_byse = open(p_byse, encoding='utf-8').read()
              s_byse = s_byse.replace('def er(self, t, e, r=45.0):', 'def er(self, t, e, r=8.0):').replace('timeout=40', 'timeout=10')
              open(p_byse, 'w', encoding='utf-8').write(s_byse)

          if os.path.exists('python_data/resources/settings.xml'):
              os.makedirs(os.path.join(work, 'python_data', 'resources'), exist_ok=True)
              shutil.copyfile('python_data/resources/settings.xml', os.path.join(work, 'python_data', 'resources', 'settings.xml'))

          sp_root = '/tmp/serious_python_site_packages'
          shutil.rmtree(sp_root, ignore_errors=True)
          for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64'):
              os.makedirs(os.path.join(sp_root, abi, 'opt'), exist_ok=True)

          for pkg in ['six', 'urllib3', 'idna', 'certifi', 'chardet', 'requests']:
              meta = json.loads(urllib.request.urlopen(f'https://pypi.org/pypi/{pkg}/json').read())
              for u in meta['urls']:
                  if u['filename'].endswith(('-py2.py3-none-any.whl', '-py3-none-any.whl')):
                      whl = urllib.request.urlopen(u['url']).read()
                      with zipfile.ZipFile(io.BytesIO(whl)) as z:
                          z.extractall(work)
                          for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64'):
                              z.extractall(os.path.join(sp_root, abi))
                      break

          import ast, base64
          main_py_b64 = ""
          main_py_bytes = base64.b64decode(main_py_b64)
          import ast
          ast.parse(main_py_bytes.decode("utf-8"))
          with open(os.path.join(work, "main.py"), "wb") as f:
              f.write(main_py_bytes)

          shutil.make_archive('app/app', 'zip', work)
          sha256_hash = hashlib.sha256(open('app/app.zip', 'rb').read()).hexdigest()
          with open('app/app.zip.hash', 'w', encoding='utf-8') as f:
              f.write(sha256_hash)
          print('Rebuilt app/app.zip size:', os.path.getsize('app/app.zip'), 'hash:', sha256_hash)

          print('=== 2b. Removing Version/4.0 and ; wv from all User-Agents across lib/ ===')
          clean_ua = 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0.0.0 Mobile Safari/537.36'
          old_ua = 'Mozilla/5.0 (Linux; Android 16; Pixel 8 Build/BP31.250610.004; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/138.0.7204.180 Mobile Safari/537.36'
          for root_dir, _, file_list in os.walk('lib'):
              for fn in file_list:
                  if fn.endswith('.dart'):
                      fp = os.path.join(root_dir, fn)
                      txt = open(fp, encoding='utf-8').read()
                      if old_ua in txt:
                          txt = txt.replace(old_ua, clean_ua)
                          open(fp, 'w', encoding='utf-8').write(txt)

          print('=== 3. Patching supported_enum.dart, webview_service.dart & filman_auth_repository.dart ===')
          p_enum = 'lib/core/utils/supported_enum.dart'
          s_enum = open(p_enum, encoding='utf-8').read()
          s_enum = s_enum.replace("https://ekino-tv.pl", "https://ekino.ws").replace("Ekino-tv.pl", "Ekino.ws")
          s_enum = s_enum.replace("SupportedService.ekino => false,", "SupportedService.ekino => true,")
          s_enum = s_enum.replace("{'g-recaptcha-response': InputType.recaptcha},", "")
          open(p_enum, 'w', encoding='utf-8').write(s_enum)

          def write_dart(path, text):
              cleaned = '\n'.join(l[10:] if l.startswith('          ') else l for l in text.splitlines())
              open(path, 'w', encoding='utf-8').write(cleaned)

          p_wv = 'lib/core/services/webview_service.dart'
          new_wv = """import 'dart:async';
          import 'dart:convert';
          import 'dart:io' as io;
          import 'package:collection/collection.dart';
          import 'package:flutter/material.dart';
          import 'package:html/dom.dart' as dom;
          import 'package:purevideo/core/utils/global_context.dart';
          import 'package:purevideo/di/injection_container.dart';
          import 'package:flutter_inappwebview/flutter_inappwebview.dart';

          class WebViewService {
            static const String cleanUserAgent = 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0.0.0 Mobile Safari/537.36';

            String _getJsCodeForElement(String elementSelector) {
              return '''
                (function() {
                  function waitForElement(selector, callback) {
                    const element = document.querySelector(selector);
                    if (element) {
                      callback(element);
                    } else {
                      setTimeout(() => waitForElement(selector, callback), 100);
                    }
                  }
                  waitForElement('$elementSelector', function(element) {
                    window.flutter_inappwebview.callHandler('messageHandler', element.outerHTML);
                  });
                })();
              ''';
            }

            Future<dom.Element?> waitForDomElement(String url, String elementSelector) async {
              final completer = Completer<dom.Element?>();
              executeJavaScript(url, _getJsCodeForElement(elementSelector)).then((result) {
                if (result != null) {
                  final document = dom.Document.html(result);
                  final element = document.querySelector(elementSelector);
                  completer.complete(element);
                } else {
                  completer.complete(null);
                }
              }).catchError((error) {
                debugPrint('Error waiting for DOM element: $error');
                completer.complete(null);
              });
              return completer.future;
            }

            Future<String?> executeJavaScript(String url, String jsCode) async {
              final completer = Completer<String?>();
              showDialog(
                context: getIt<GlobalContext>().context,
                barrierDismissible: false,
                builder: (context) => _buildWebViewDialog(context, url, jsCode, completer),
              );
              return completer.future;
            }

            Future<List<io.Cookie>?> getCfCookies(String url, {List<io.Cookie>? initialCookies}) async {
              final completer = Completer<List<io.Cookie>?>();
              Future.delayed(const Duration(seconds: 6), () {
                if (!completer.isCompleted) completer.complete(null);
              });
              showDialog(
                context: getIt<GlobalContext>().context,
                builder: (context) {
                  return Dialog(
                    backgroundColor: Colors.transparent,
                    elevation: 0,
                    insetPadding: EdgeInsets.zero,
                    child: SizedBox(
                      width: MediaQuery.of(context).size.width,
                      height: MediaQuery.of(context).size.height,
                      child: InAppWebView(
                        initialUrlRequest: URLRequest(url: WebUri(url)),
                        initialSettings: InAppWebViewSettings(
                          userAgent: cleanUserAgent,
                          transparentBackground: true,
                          javaScriptEnabled: true,
                          domStorageEnabled: true,
                          clearCache: false,
                          cacheEnabled: true,
                          incognito: false,
                          useShouldInterceptRequest: true,
                        ),
                        onWebViewCreated: (controller) async {
                          if (initialCookies != null && initialCookies.isNotEmpty) {
                            for (io.Cookie cookie in initialCookies) {
                              await CookieManager.instance().setCookie(
                                name: cookie.name,
                                url: WebUri(url),
                                value: cookie.value,
                                domain: cookie.domain,
                              );
                            }
                          }
                        },
                        shouldInterceptRequest: (controller, request) async {
                          if (!request.url.rawValue.contains(url)) return null;
                          final cookies = await CookieManager.instance().getCookies(url: request.url);
                          final cfClearance = cookies.firstWhereOrNull((c) => c.name == 'cf_clearance');
                          if (cfClearance != null && !completer.isCompleted) {
                            completer.complete(cookies.map((c) => io.Cookie(c.name, c.value)).toList());
                            if (context.mounted) Navigator.of(context).pop();
                          }
                          return null;
                        },
                        onLoadStop: (controller, loadedUrl) async {
                          try {
                            if (loadedUrl == null) return;
                            final cookies = await CookieManager.instance().getCookies(url: loadedUrl);
                            final cfClearance = cookies.firstWhereOrNull((c) => c.name == 'cf_clearance');
                            if (cfClearance != null && !completer.isCompleted) {
                              completer.complete(cookies.map((c) => io.Cookie(c.name, c.value)).toList());
                              if (context.mounted) Navigator.of(context).pop();
                            }
                          } catch (_) {
                            if (context.mounted) Navigator.of(context).pop();
                          }
                        },
                      ),
                    ),
                  );
                },
              );
              return completer.future;
            }

            Widget _buildWebViewDialog(BuildContext context, String url, String jsCode, Completer<String?> completer) {
              final isLogin = url.contains('logowanie') || url.contains('login');
              return Dialog(
                backgroundColor: isLogin ? const Color(0xFF0F172A) : Colors.transparent,
                elevation: 0,
                insetPadding: EdgeInsets.zero,
                child: SizedBox(
                  width: MediaQuery.of(context).size.width,
                  height: MediaQuery.of(context).size.height,
                  child: Column(
                    children: [
                      if (isLogin)
                        SafeArea(
                          bottom: false,
                          child: Container(
                            color: const Color(0xFF1E293B),
                            padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                            child: Row(
                              children: [
                                IconButton(
                                  icon: const Icon(Icons.close, color: Colors.white),
                                  onPressed: () {
                                    if (!completer.isCompleted) {
                                      completer.complete('{"success":false,"error":"Anulowano logowanie"}');
                                    }
                                    if (context.mounted) Navigator.of(context).pop();
                                  },
                                ),
                                const Expanded(
                                  child: Text(
                                    'Potwierdź Captcha i kliknij Zaloguj',
                                    style: TextStyle(color: Colors.white, fontSize: 14, fontWeight: FontWeight.w600),
                                    overflow: TextOverflow.ellipsis,
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                      Expanded(
                        child: InAppWebView(
                          initialUrlRequest: URLRequest(url: WebUri(url)),
                          initialSettings: InAppWebViewSettings(
                            userAgent: cleanUserAgent,
                            transparentBackground: !isLogin,
                            supportZoom: true,
                            disableContextMenu: false,
                            disableHorizontalScroll: false,
                            disableVerticalScroll: false,
                            javaScriptEnabled: true,
                            domStorageEnabled: true,
                            databaseEnabled: true,
                            clearCache: false,
                            cacheEnabled: true,
                            incognito: false,
                            thirdPartyCookiesEnabled: true,
                          ),
                          onWebViewCreated: (controller) async {
                            controller.addJavaScriptHandler(
                              handlerName: 'messageHandler',
                              callback: (message) async {
                                if (message.isNotEmpty && message[0] != null) {
                                  var msgStr = message[0].toString();
                                  if (msgStr.contains('"success":true') || msgStr.contains('"success": true')) {
                                    try {
                                      final origin = Uri.parse(url).origin;
                                      final allCookies = await CookieManager.instance().getCookies(url: WebUri(origin));
                                      if (allCookies.isNotEmpty) {
                                        final cookieStr = allCookies.map((c) => '${c.name}=${c.value}').join('; ');
                                        msgStr = jsonEncode({'success': true, 'cookies': cookieStr});
                                      }
                                    } catch (_) {}
                                  }
                                  if (!completer.isCompleted) {
                                    completer.complete(msgStr);
                                    if (context.mounted) Navigator.of(context).pop();
                                  }
                                }
                              },
                            );
                          },
                          onLoadStop: (controller, loadedUrl) async {
                            try {
                              final cur = loadedUrl?.toString() ?? '';
                              if (url.contains('filman.cc/logowanie') &&
                                  cur.contains('filman.cc') &&
                                  !cur.contains('/logowanie') &&
                                  !cur.contains('/rejestracja') &&
                                  !cur.contains('/przypomnij')) {
                                final html = await controller.evaluateJavascript(source: 'document.documentElement.innerHTML');
                                if (html != null && (html.toString().contains('wyloguj') || html.toString().contains('item-list'))) {
                                  final allCookies = await CookieManager.instance().getCookies(url: WebUri('https://filman.cc'));
                                  if (allCookies.isNotEmpty && !completer.isCompleted) {
                                    final cookieStr = allCookies.map((c) => '${c.name}=${c.value}').join('; ');
                                    completer.complete(jsonEncode({'success': true, 'cookies': cookieStr}));
                                    if (context.mounted) Navigator.of(context).pop();
                                    return;
                                  }
                                }
                              }
                              await controller.evaluateJavascript(source: jsCode);
                            } catch (e) {
                              debugPrint('Błąd wykonywania JavaScript: $e');
                            }
                          },
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          """
          write_dart(p_wv, new_wv)

          p_auth = 'lib/data/repositories/filman/filman_auth_repository.dart'
          new_f_auth = """import 'dart:convert';
          import 'dart:async';
          import 'dart:io';
          import 'package:dio/dio.dart';
          import 'package:flutter/material.dart';
          import 'package:purevideo/core/services/webview_service.dart';
          import 'package:purevideo/core/utils/supported_enum.dart';
          import 'package:purevideo/data/models/account_model.dart';
          import 'package:purevideo/data/models/auth_model.dart';
          import 'package:purevideo/data/repositories/auth_repository.dart';
          import 'package:purevideo/data/repositories/filman/filman_dio_factory.dart';
          import 'package:purevideo/core/services/secure_storage_service.dart';
          import 'package:purevideo/di/injection_container.dart';

          class FilmanAuthRepository implements AuthRepository {
            late Dio _dio;
            AccountModel? _account;
            final _authController = StreamController<AuthModel>.broadcast();
            late StreamSubscription<AuthModel> _authSubscription;

            FilmanAuthRepository([AccountModel? account]) {
              _loadSavedAccount();
              _authSubscription = _authController.stream.listen(_onAuthChanged);
            }

            Future<void> _loadSavedAccount() async {
              try {
                final accountJson = await SecureStorageService.getServiceData(
                  SupportedService.filman,
                  'account',
                );
                if (accountJson != null) {
                  _account = AccountModel.fromMap(jsonDecode(accountJson));
                  _dio = FilmanDioFactory.getDio(_account);
                  try {
                    final res = await _dio.get('/');
                    final body = res.data?.toString() ?? '';
                    final loc = res.headers.map['location']?.join(' ') ?? '';
                    if (res.statusCode == 302 || res.statusCode == 301 || loc.contains('logowanie') || (!body.contains('wyloguj') && !body.contains('Just a moment'))) {
                      throw Exception('Sesja Filman wygasła lub była niepełna');
                    }
                    _authController.add(
                      AuthModel(
                        service: SupportedService.filman,
                        success: true,
                        account: _account,
                      ),
                    );
                  } catch (e) {
                    await SecureStorageService.deleteServiceData(
                      SupportedService.filman,
                      'account',
                    );
                    _account = null;
                    _dio = FilmanDioFactory.getDio(null);
                  }
                } else {
                  _dio = FilmanDioFactory.getDio(null);
                }
              } catch (e) {
                debugPrint('Błąd podczas ładowania konta Filman.cc: $e');
                _dio = FilmanDioFactory.getDio(null);
              }
            }

            void _onAuthChanged(AuthModel auth) {
              if (auth.service == SupportedService.filman) {
                _dio = FilmanDioFactory.getDio(auth.account);
              }
            }

            @override
            Stream<AuthModel> get authStream => _authController.stream;

            String _getFilmanLoginScript(String login, String password) {
              final safeLogin = login.replaceAll("'", "\\'");
              final safePass = password.replaceAll("'", "\\'");
              return '''
                (function() {
                  try {
                    const st = document.createElement('style');
                    st.innerHTML = '#outdated, .outdated-browser, .browser-Gate { display: none !important; }';
                    if (document.head) document.head.appendChild(st);
                  } catch (_) {}

                  if (!window.location.href.includes('/logowanie') &&
                      (document.querySelector('a[href*="wyloguj"]') || document.querySelector('#item-list'))) {
                    window.flutter_inappwebview.callHandler('messageHandler', JSON.stringify({success: true, cookies: document.cookie}));
                    return;
                  }

                  function setupForm() {
                    const form = document.querySelector('#signin-form') || document.querySelector('form[action*="logowanie"]');
                    if (!form) {
                      setTimeout(setupForm, 200);
                      return;
                    }
                    const lInput = form.querySelector('input[name="login"]') || form.login;
                    const pInput = form.querySelector('input[name="password"]') || form.password;
                    if (lInput && !lInput.value) lInput.value = '$safeLogin';
                    if (pInput && !pInput.value) pInput.value = '$safePass';

                    if (!window._filmanCaptchaTimer) {
                      window._filmanCaptchaTimer = setInterval(function() {
                        const g = document.querySelector('[name="g-recaptcha-response"]');
                        const c = document.querySelector('[name="cf-turnstile-response"]');
                        const val = (g && g.value) || (c && c.value) || '';
                        if (val && val.length > 20 && !window._filmanSubmittedOnce) {
                          window._filmanSubmittedOnce = true;
                          clearInterval(window._filmanCaptchaTimer);
                          const btn = form.querySelector("button[name='submit']") || form.querySelector("button[type='submit']") || form.querySelector("input[type='submit']");
                          if (btn) btn.click();
                        }
                      }, 400);
                    }
                  }
                  setupForm();
                })();
              ''';
            }

            @override
            Future<AuthModel> signIn(Map<String, String> fields) async {
              try {
                final webviewLogin = await getIt<WebViewService>().executeJavaScript(
                  '${SupportedService.filman.baseUrl}/logowanie',
                  _getFilmanLoginScript(fields['login'] ?? '', fields['password'] ?? ''),
                );
                final json = jsonDecode(webviewLogin!);
                if (json['success'] == true && json['cookies'] != null) {
                  final cookieList = (json['cookies'] as String).split(';');
                  final cookies = cookieList
                      .map((h) => h.trim())
                      .where((h) => h.contains('=') && !h.startsWith('='))
                      .map((h) => Cookie(h.substring(0, h.indexOf('=')).trim(), h.substring(h.indexOf('=') + 1).trim()))
                      .toList();
                  _account = AccountModel(
                    fields: fields,
                    cookies: cookies,
                    service: SupportedService.filman,
                  );
                  final authModel = AuthModel(
                    service: SupportedService.filman,
                    success: true,
                    account: _account,
                  );
                  _authController.add(authModel);
                  return authModel;
                } else {
                  final authModel = AuthModel(
                    service: SupportedService.filman,
                    success: false,
                    error: [json['error'] ?? 'Logowanie nie powiodło się'],
                  );
                  _authController.add(authModel);
                  return authModel;
                }
              } catch (e) {
                final authModel = AuthModel(
                  service: SupportedService.filman,
                  success: false,
                  error: ['Błąd logowania: $e'],
                );
                _authController.add(authModel);
                return authModel;
              }
            }

            @override
            AccountModel? getAccount() => _account;

            @override
            Future<void> setAccount(AccountModel account) async {
              _account = account;
              _dio = FilmanDioFactory.getDio(_account);
              await SecureStorageService.saveServiceData(
                SupportedService.filman,
                'account',
                jsonEncode(account.toMap()),
              );
              _authController.add(AuthModel(service: SupportedService.filman, success: true, account: _account));
            }

            @override
            Future<void> signOut() async {
              _account = null;
