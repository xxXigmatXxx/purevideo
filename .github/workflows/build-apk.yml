name: Build PureVideo APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild app.zip (LibResolveURL + deps) & Apply Filman + Player Fixes
        run: |
          python3 - << 'PYEOF'
          import os, shutil, zipfile, hashlib, urllib.request, json, io, re

          print('=== 1. Patching android/app/build.gradle.kts (minSdk=24, compileSdk=36) ===')
          p_gradle = 'android/app/build.gradle.kts'
          s_gradle = open(p_gradle, encoding='utf-8').read()
          s_gradle = s_gradle.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          s_gradle = s_gradle.replace('ndkVersion = "28.2.13676358"', 'ndkVersion = "27.0.12077973"')
          open(p_gradle, 'w', encoding='utf-8').write(s_gradle)

          print('=== 2. Rebuilding app/app.zip and app/app.zip.hash ===')
          work = '/tmp/_app_zip_build'
          shutil.rmtree(work, ignore_errors=True)
          os.makedirs(work, exist_ok=True)

          with zipfile.ZipFile('app/app.zip', 'r') as z:
              z.extractall(work)

          for root, dirs, files in os.walk(work, topdown=False):
              for f in files:
                  if f.endswith(('.pyc', '.pyo')):
                      os.remove(os.path.join(root, f))
              for d in dirs:
                  if d in ('__pycache__', '.git', '.dart_tool'):
                      shutil.rmtree(os.path.join(root, d), ignore_errors=True)

          if os.path.exists('python_data/resources/settings.xml'):
              os.makedirs(os.path.join(work, 'python_data', 'resources'), exist_ok=True)
              shutil.copyfile('python_data/resources/settings.xml', os.path.join(work, 'python_data', 'resources', 'settings.xml'))

          sp_root = '/tmp/serious_python_site_packages'
          shutil.rmtree(sp_root, ignore_errors=True)
          for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64'):
              os.makedirs(os.path.join(sp_root, abi, 'opt'), exist_ok=True)

          for pkg in ['six', 'urllib3', 'idna', 'certifi', 'chardet', 'requests']:
              meta = json.loads(urllib.request.urlopen(f'https://pypi.org/pypi/{pkg}/json').read())
              for u in meta['urls']:
                  if u['filename'].endswith(('-py2.py3-none-any.whl', '-py3-none-any.whl')):
                      whl = urllib.request.urlopen(u['url']).read()
                      with zipfile.ZipFile(io.BytesIO(whl)) as z:
                          z.extractall(work)
                          for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64'):
                              z.extractall(os.path.join(sp_root, abi))
                      break

          main_py = '''#!/usr/bin/env python3
          import os, re, sys, ssl, json, base64, traceback, urllib.request
          from urllib.parse import unquote
          from http.server import HTTPServer, BaseHTTPRequestHandler
          from socketserver import ThreadingMixIn
          from concurrent.futures import ThreadPoolExecutor

          base_dir = os.path.dirname(os.path.realpath(__file__))
          data_dir = os.path.join(base_dir, "python_data")
          os.makedirs(os.path.join(data_dir, "resources"), exist_ok=True)
          os.environ["LIBRESOLVEURL_CONFIG_DIR"] = data_dir
          os.environ["LIBRESOLVEURL_ADDON_PATH"] = data_dir

          for p in (base_dir, data_dir, os.path.join(base_dir, "LibResolveURL")):
              if p not in sys.path:
                  sys.path.insert(0, p)

          try:
              ssl._create_default_https_context = ssl._create_unverified_context
          except Exception:
              pass

          LIBRESOLVEURL_AVAILABLE = False
          libresolveurl = None
          try:
              import libresolveurl
              try:
                  import resolveurl.common as common
                  common.settings_file = os.path.join(data_dir, "resources", "settings.xml")
                  from resolveurl.lib import net
                  orig_init = net.Net.__init__
                  def patched_net_init(self, *args, **kwargs):
                      kwargs["ssl_verify"] = False
                      orig_init(self, *args, **kwargs)
                  net.Net.__init__ = patched_net_init
              except Exception as e:
                  print(f"DEBUG: Net patch warning: {e}")
              LIBRESOLVEURL_AVAILABLE = True
          except Exception as e:
              print(f"DEBUG: libresolveurl import error: {e}")

          UA = "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36"

          def host_name(url: str) -> str:
              m = re.search(r"://(?:www\.)?([^/]+)", url)
              return m.group(1).split(".")[0].upper() if m else "WIDEO"

          def clean_and_unwrap_url(url: str) -> str:
              url = (url or "").strip()
              if url.startswith("{"):
                  try:
                      obj = json.loads(url)
                      url = str(obj.get("src") or obj.get("url") or url).strip()
                  except Exception:
                      pass
              if url.startswith("//"):
                  url = "https:" + url
              if "tmp-url.pro" in url:
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": UA, "Referer": "https://filman.cc/"})
                      with urllib.request.urlopen(req, timeout=6) as resp:
                          body = resp.read().decode("utf-8", errors="ignore")
                      me = re.search(r"var\s+_e\s*=\s*['\"]([A-Za-z0-9+/=]+)['\"]", body)
                      ma = re.search(r"var\s+_a\s*=\s*['\"]([^'\"]+)['\"]", body)
                      mb = re.search(r"var\s+_b\s*=\s*['\"]([^'\"]+)['\"]", body)
                      mc = re.search(r"var\s+_c\s*=\s*['\"]([^'\"]+)['\"]", body)
                      if me and ma and mb and mc:
                          raw = base64.b64decode(me.group(1))
                          key = (ma.group(1) + mb.group(1) + mc.group(1)).encode("utf-8")
                          dec = "".join(chr(raw[i] ^ key[i % len(key)]) for i in range(len(raw)))
                          if dec.startswith("http"):
                              return dec
                  except Exception:
                      pass
              return url

          def fallback_regex_resolve(url: str):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": UA, "Referer": "https://filman.cc/"})
                  with urllib.request.urlopen(req, timeout=6) as resp:
                      html = resp.read().decode("utf-8", errors="ignore")
                  redir = re.search(r"window\.location\.href\s*=\s*['\"](https?://[^'\"]+)['\"]", html)
                  if redir:
                      url = redir.group(1)
                      req2 = urllib.request.Request(url, headers={"User-Agent": UA, "Referer": "https://filman.cc/"})
                      with urllib.request.urlopen(req2, timeout=6) as resp2:
                          html = resp2.read().decode("utf-8", errors="ignore")
                  m_mp4 = re.search(r"sourcesCode\s*:\s*\[\s*\{\s*src:\s*['\"](https?://[^'\"]+)['\"]", html) or re.search(r"<source[^>]+src=['\"](https?://[^'\"]+\.mp4[^'\"]*)['\"]", html)
                  if m_mp4:
                      return m_mp4.group(1) + f"|User-Agent={UA}&Referer={url}"
                  m_rob = re.search(r"id=['\"]robotlink['\"][^>]*>([^<]+)", html)
                  m_tok = re.search(r"getElementById\(['\"]robotlink['\"]\)\.innerHTML\s*\+\s*['\"]([^'\"]+)['\"]", html)
                  if m_rob and m_tok:
                      return "https:" + m_rob.group(1).strip() + m_tok.group(1).strip() + f"|User-Agent={UA}&Referer={url}"
                  m_hls = re.search(r"['\"]hls['\"]\s*:\s*['\"](https?://[^'\"]+\.m3u8[^'\"]*)['\"]", html) or re.search(r"(https?://[^\s\"'<>\\]+\.m3u8[^\s\"'<>\\]*)", html)
                  if m_hls:
                      return m_hls.group(1).replace("\\/", "/") + f"|User-Agent={UA}&Referer={url}"
                  for b64 in re.findall(r"['\"](aHR0c[A-Za-z0-9+/=]{16,})['\"]", html):
                      try:
                          d = base64.b64decode(b64).decode("utf-8", errors="ignore")
                          if d.startswith("http"):
                              return d + f"|User-Agent={UA}&Referer={url}"
                      except Exception:
                          pass
              except Exception:
                  pass
              return None

          def resolve_single_item(item):
              try:
                  if isinstance(item, str):
                      raw_url, language, quality, extra_headers = item, "PL", "HD", {}
                  elif isinstance(item, dict):
                      raw_url = item.get("url") or ""
                      language = item.get("language") or item.get("lang") or "PL"
                      quality = item.get("quality") or "HD"
                      extra_headers = item.get("headers") or {}
                  else:
                      return None, None
                  url = clean_and_unwrap_url(raw_url)
                  if not url:
                      return None, None
                  headers = {"User-Agent": UA, "Referer": url}
                  if isinstance(extra_headers, dict):
                      headers.update(extra_headers)
                  resolved = None
                  if LIBRESOLVEURL_AVAILABLE and libresolveurl:
                      try:
                          resolved = libresolveurl.resolve(url)
                      except Exception:
                          resolved = None
                  if not resolved:
                      resolved = fallback_regex_resolve(url)
                  if resolved:
                      if "|" in resolved:
                          resolved_url, header_str = resolved.split("|", 1)
                          for pair in header_str.split("&"):
                              if "=" in pair:
                                  k, v = pair.split("=", 1)
                                  headers[k.strip()] = unquote(v.strip())
                          resolved = resolved_url.strip()
                      return ({"host": host_name(url), "url": resolved, "headers": headers, "language": language, "quality": quality}, None)
                  else:
                      return (None, {"host": host_name(url) + " (Web)", "url": url, "headers": {"User-Agent": UA, "Referer": "https://filman.cc/"}, "language": language, "quality": quality})
              except Exception:
                  return None, None

          class ThreadingHTTPServer(ThreadingMixIn, HTTPServer):
              daemon_threads = True
              allow_reuse_address = True

          class ResolverHandler(BaseHTTPRequestHandler):
              def _send_json(self, status: int, payload):
                  body = json.dumps(payload).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def do_GET(self):
                  self._send_json(200, {"status": "ok", "libresolveurl": LIBRESOLVEURL_AVAILABLE})
              def do_POST(self):
                  if not self.path.startswith("/resolve"):
                      self._send_json(404, {"error": "Not found"})
                      return
                  try:
                      length = int(self.headers.get("Content-Length", "0"))
                      raw_body = self.rfile.read(length).decode("utf-8", errors="ignore")
                      data = json.loads(raw_body) if raw_body else []
                      links = data if isinstance(data, list) else data.get("links", [])
                      results, fallbacks = [], []
                      with ThreadPoolExecutor(max_workers=8) as ex:
                          for res, fb in ex.map(resolve_single_item, links):
                              if res:
                                  results.append(res)
                              elif fb:
                                  fallbacks.append(fb)
                      results.extend(fallbacks)
                      self._send_json(200, results)
                  except Exception as e:
                      self._send_json(500, {"error": str(e)})

          if __name__ == "__main__":
              port = int(os.environ.get("RESOLVER_PORT", "8080"))
              print(f"ResolveURL server starting on http://0.0.0.0:{port}")
              sys.stdout.flush()
              ThreadingHTTPServer(("0.0.0.0", port), ResolverHandler).serve_forever()
          '''
          with open(os.path.join(work, 'main.py'), 'w', encoding='utf-8') as f:
              f.write('\n'.join(line[10:] if line.startswith('          ') else line for line in main_py.splitlines()))

          shutil.make_archive('app/app', 'zip', work)
          sha256_hash = hashlib.sha256(open('app/app.zip', 'rb').read()).hexdigest()
          with open('app/app.zip.hash', 'w', encoding='utf-8') as f:
              f.write(sha256_hash)
          print('Rebuilt app/app.zip size:', os.path.getsize('app/app.zip'), 'hash:', sha256_hash)

          print('=== 3. Patching webview_service.dart & filman_auth_repository.dart (HttpOnly cookies) ===')
          p_wv = 'lib/core/services/webview_service.dart'
          s_wv = open(p_wv, encoding='utf-8').read()
          s_wv = s_wv.replace('incognito: true,', 'incognito: false,').replace('clearCache: true,', 'clearCache: false,')
          old_cb = 'completer.complete(message[0].toString());'
          new_cb = '''var msgStr = message[0].toString();
                            try {
                              final allCookies = await CookieManager.instance().getCookies(url: WebUri(url));
                              if (allCookies.isNotEmpty) {
                                final cookieStr = allCookies.map((c) => '${c.name}=${c.value}').join(';');
                                if (msgStr.trim().startsWith('{')) {
                                  msgStr = '{"success":true,"cookies":"$cookieStr"}';
                                }
                              }
                            } catch (_) {}
                            if (!completer.isCompleted) completer.complete(msgStr);'''
          assert old_cb in s_wv, 'old_cb not found'
          s_wv = s_wv.replace('callback: (message) {', 'callback: (message) async {').replace(old_cb, new_cb)
          s_wv = s_wv.replace('final completer = Completer<List<io.Cookie>?>();', 'final completer = Completer<List<io.Cookie>?>(); Future.delayed(const Duration(seconds: 6), () { if (!completer.isCompleted) completer.complete(null); });')
          open(p_wv, 'w', encoding='utf-8').write(s_wv)

          p_auth = 'lib/data/repositories/filman/filman_auth_repository.dart'
          s_auth = open(p_auth, encoding='utf-8').read()
          old_auth_cookies = '.map((header) => Cookie.fromSetCookieValue(header))'
          new_auth_cookies = ".map((h) => h.trim()).where((h) => h.contains('=') && !h.startsWith('=')).map((h) => Cookie(h.substring(0, h.indexOf('=')).trim(), h.substring(h.indexOf('=') + 1).trim()))"
          assert old_auth_cookies in s_auth, 'old_auth_cookies not found'
          s_auth = s_auth.replace(old_auth_cookies, new_auth_cookies)
          open(p_auth, 'w', encoding='utf-8').write(s_auth)

          print('=== 4. Patching filman_movie_repository.dart ===')
          p_fmr = 'lib/data/repositories/filman/filman_movie_repository.dart'
          s_fmr = open(p_fmr, encoding='utf-8').read()
          m_res = re.search(r'Future<String> _resolveTempUrl\(String tempUrl\) async \{[\s\S]*?\n  \}', s_fmr)
          if m_res:
              s_fmr = s_fmr[:m_res.start()] + 'Future<String> _resolveTempUrl(String tempUrl) async => tempUrl;' + s_fmr[m_res.end():]
          s_fmr = s_fmr.replace('link = (utf8.decode(decoded));', '''final d = utf8.decode(decoded).trim(); if (d.startsWith('{')) { try { final dynamic m = jsonDecode(d); link = (m is Map ? (m['src'] ?? m['url'] ?? d) : d).toString().trim(); } catch (_) { link = d; } } else { link = d; } if (link.startsWith('//')) link = 'https:$link';''')
          s_fmr = s_fmr.replace("return '';", 'return tempUrl;')
          s_fmr = s_fmr.replace('if (tableData.length < 3) continue;', 'if (tableData.isEmpty) continue;')
          open(p_fmr, 'w', encoding='utf-8').write(s_fmr)

          print('=== 5. Patching resolve_url_service.dart (fast polling & non-blocking fallback) ===')
          p_rus = 'lib/core/services/resolve_url_service.dart'
          new_rus = '''import "dart:convert";\nimport "package:dio/dio.dart";\nimport "package:flutter/cupertino.dart";\nimport "package:purevideo/data/models/link_model.dart";\nimport "package:purevideo/data/repositories/video_source_repository.dart";\n\nclass ResolveUrlService {\n  final Dio _dio;\n  String serverUrl = "http://localhost:8080";\n  ResolveUrlService(this._dio);\n\n  Future<List<VideoSource>> resolve(List<HostLink> urls) async {\n    debugPrint("Resolving URLs: $urls");\n    final validUrls = urls.where((u) => u.url.trim().isNotEmpty).toList();\n    if (validUrls.isEmpty) return [];\n\n    final fallbackSources = validUrls.map((u) {\n      String hostName = "Odtwarzacz (Web)";\n      try {\n        final uri = Uri.parse(u.url);\n        if (uri.host.isNotEmpty) {\n          hostName = "${uri.host.replaceFirst('www.', '').split('.').first.toUpperCase()} (Web)";\n        }\n      } catch (_) {}\n      return VideoSource(url: u.url, lang: u.lang, quality: u.quality, host: hostName, headers: const {"Referer": "https://filman.cc/"});\n    }).toList();\n\n    try {\n      final isUp = await _waitForServer();\n      if (!isUp) {\n        debugPrint("Resolver server not ready, using fallback sources immediately");\n        return fallbackSources;\n      }\n      final response = await _dio.post(\n        "$serverUrl/resolve",\n        data: jsonEncode(validUrls.map((link) => {"url": link.url, "language": link.lang, "quality": link.quality}).toList()),\n        options: Options(headers: {"Content-Type": "application/json"}, connectTimeout: const Duration(seconds: 2), receiveTimeout: const Duration(seconds: 4), sendTimeout: const Duration(seconds: 2), validateStatus: (status) => status != null && status < 500),\n      );\n      if (response.data is List && (response.data as List).isNotEmpty) {\n        final resolved = (response.data as List).map((item) => VideoSource(url: item["url"] ?? "", lang: item["language"] ?? "", quality: item["quality"] ?? "", host: item["host"] ?? "Wideo", headers: item["headers"] != null ? Map<String, String>.from(item["headers"]) : null)).where((s) => s.url.isNotEmpty).toList();\n        if (resolved.isNotEmpty) return resolved;\n      }\n      return fallbackSources;\n    } catch (e) {\n      debugPrint("Error resolving URLs: $e");\n      return fallbackSources;\n    }\n  }\n\n  Future<bool> _waitForServer() async {\n    for (var i = 0; i < 5; i++) {\n      try {\n        final r = await _dio.get("$serverUrl/health", options: Options(connectTimeout: const Duration(milliseconds: 300), receiveTimeout: const Duration(milliseconds: 300), sendTimeout: const Duration(milliseconds: 300), validateStatus: (_) => true));\n        if (r.statusCode == 200) return true;\n      } catch (_) {}\n      await Future.delayed(const Duration(milliseconds: 200));\n    }\n    return false;\n  }\n}\n'''
          open(p_rus, 'w', encoding='utf-8').write(new_rus)

          print('=== 6. Patching player_bloc.dart & player_screen.dart ===')
          p_pb = 'lib/presentation/player/bloc/player_bloc.dart'
          s_pb = open(p_pb, encoding='utf-8').read()
          s_pb = s_pb.replace('// await _videoSourceRepository.scrapeVideoUrls(_movie!); we already done this in movie details bloc', 'if (movieDetails.directUrls == null || movieDetails.directUrls!.isEmpty) { movieDetails = await _videoSourceRepository.scrapeVideoUrls(_movie!); }')
          s_pb = s_pb.replace('await _player.open(', "Future.delayed(const Duration(seconds: 6), () { if (!isClosed && state.isBuffering) emit(state.copyWith(isBuffering: false, isPlaying: true, displayState: '')); }); if (event.source.host.contains('(Web)')) { await _player.stop(); emit(state.copyWith(isBuffering: false, isPlaying: true, selectedSource: event.source, displayState: '')); return; } await _player.open(")
          s_pb = s_pb.replace("// Don't emit isPlaying yet - wait for buffering state change\n      emit(state.copyWith(", 'emit(state.copyWith(isBuffering: false, isPlaying: true,')
          open(p_pb, 'w', encoding='utf-8').write(s_pb)

          p_ps = 'lib/presentation/player/screens/player_screen.dart'
          s_ps = "import 'package:flutter_inappwebview/flutter_inappwebview.dart';\n" + open(p_ps, encoding='utf-8').read()
          anchor_ps = 'Widget _buildPlayerView(BuildContext context, PlayerState state) {'
          assert anchor_ps in s_ps, 'anchor_ps not found'
          web_branch = '''Widget _buildPlayerView(BuildContext context, PlayerState state) {
              final selectedUrl = state.selectedSource?.url ?? '';
              final isWeb = (state.selectedSource?.host ?? '').contains('(Web)');
              if (selectedUrl.isNotEmpty && isWeb) {
                return Scaffold(
                  backgroundColor: Colors.black,
                  body: Stack(
                    children: [
                      InAppWebView(
                        key: ValueKey(selectedUrl),
                        initialUrlRequest: URLRequest(url: WebUri(selectedUrl), headers: const {'Referer': 'https://filman.cc/'}),
                        initialSettings: InAppWebViewSettings(javaScriptEnabled: true, domStorageEnabled: true, mediaPlaybackRequiresUserGesture: false, allowsInlineMediaPlayback: true, iframeAllowFullscreen: true, supportMultipleWindows: true, javaScriptCanOpenWindowsAutomatically: false, useShouldOverrideUrlLoading: true, userAgent: 'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36'),
                        onCreateWindow: (controller, action) async => false,
                        shouldOverrideUrlLoading: (controller, nav) async {
                          final u = nav.request.url?.toString() ?? '';
                          if (!u.startsWith('http')) return NavigationActionPolicy.CANCEL;
                          return NavigationActionPolicy.ALLOW;
                        },
                      ),
                      SafeArea(
                        child: Align(
                          alignment: Alignment.topCenter,
                          child: Container(
                            color: Colors.black54,
                            height: 48,
                            padding: const EdgeInsets.symmetric(horizontal: 8),
                            child: Row(
                              children: [
                                IconButton(icon: const Icon(Icons.arrow_back, color: Colors.white), onPressed: () => Navigator.of(context).pop()),
                                Expanded(child: Text('${state.selectedSource?.host ?? "Odtwarzacz"} • ${state.selectedSource?.quality ?? ""} ${state.selectedSource?.lang ?? ""}', style: const TextStyle(color: Colors.white, fontSize: 14, fontWeight: FontWeight.bold), overflow: TextOverflow.ellipsis)),
                                if (state.videoSources != null && state.videoSources!.length > 1)
                                  PopupMenuButton<VideoSource>(
                                    icon: const Icon(Icons.settings, color: Colors.white),
                                    onSelected: (source) => context.read<PlayerBloc>().add(ChangeVideoSource(source: source)),
                                    itemBuilder: (context) => state.videoSources!.map((source) => PopupMenuItem<VideoSource>(value: source, child: Text('${source.host}: ${source.quality} - ${source.lang}'))).toList(),
                                  ),
                              ],
                            ),
                          ),
                        ),
                      ),
                    ],
                  ),
                );
              }'''
          s_ps = s_ps.replace(anchor_ps, web_branch)
          open(p_ps, 'w', encoding='utf-8').write(s_ps)

          p_ts = 'lib/presentation/settings/screens/theme_screen.dart'
          if os.path.exists(p_ts):
              s_ts = open(p_ts, encoding='utf-8').read().replace('activeThumbColor:', 'activeColor:')
              open(p_ts, 'w', encoding='utf-8').write(s_ts)

          print('=== 7. Patching GoRouter & Search Navigation (/movie?filmweb=true) ===')
          p_r = 'lib/presentation/global/routes/router.dart'
          s_r = open(p_r, encoding='utf-8').read()
          r_old = "path: '/movie/:title',"
          r_new = "path: '/movie',\n      name: 'movie_details_plain',\n      pageBuilder: (context, state) {\n        return NoTransitionPage(\n          child: state.uri.queryParameters['filmweb'] == 'true'\n              ? MovieDetailsScreen(\n                  filmwebData: state.extra as FilmwebPreviewModel)\n              : MovieDetailsScreen(movie: state.extra as MovieModel),\n        );\n      },\n    ),\n    GoRoute(\n      path: '/movie/:title',"
          if r_old in s_r:
              s_r = s_r.replace(r_old, r_new, 1)
              open(p_r, 'w', encoding='utf-8').write(s_r)

          p_ss = 'lib/presentation/search/screens/search_screen.dart'
          s_ss = open(p_ss, encoding='utf-8').read()
          ss_old = "pathParameters: {'title': movie.title},"
          ss_new = "pathParameters: {'title': Uri.encodeComponent((movie.title.trim().isNotEmpty ? movie.title.trim() : (movie.originalTitle.trim().isNotEmpty ? movie.originalTitle.trim() : 'film')).replaceAll('/', '-'))},"
          if ss_old in s_ss:
              s_ss = s_ss.replace(ss_old, ss_new)
              open(p_ss, 'w', encoding='utf-8').write(s_ss)

          p_fm = 'lib/data/models/filmweb_model.dart'
          s_fm = open(p_fm, encoding='utf-8').read()
          fm_old = "title: json['title']?['title'] ?? '',"
          fm_new = "title: (json['title'] is Map ? (json['title']['title'] ?? '') : (json['title']?.toString() ?? '')).toString().trim().isNotEmpty ? (json['title'] is Map ? (json['title']['title'] ?? '') : (json['title']?.toString() ?? '')).toString().trim() : ((json['originalTitle'] is Map ? (json['originalTitle']['title'] ?? '') : (json['originalTitle']?.toString() ?? '')).toString().trim().isNotEmpty ? (json['originalTitle'] is Map ? (json['originalTitle']['title'] ?? '') : (json['originalTitle']?.toString() ?? '')).toString().trim() : 'Film'),"
          if fm_old in s_fm:
              s_fm = s_fm.replace(fm_old, fm_new)
              open(p_fm, 'w', encoding='utf-8').write(s_fm)

          p_mdb = 'lib/presentation/movie_details/bloc/movie_details_bloc.dart'
          s_mdb = open(p_mdb, encoding='utf-8').read()
          if 'await loggedServiceEntry.value.searchMovies(event.movie.title);' in s_mdb:
              s_mdb = s_mdb.replace('await loggedServiceEntry.value.searchMovies(event.movie.title);', "await (async () async { final q1 = event.movie.title.trim().isNotEmpty ? event.movie.title.trim() : event.movie.originalTitle.trim(); var r = await loggedServiceEntry.value.searchMovies(q1).timeout(const Duration(seconds: 7), onTimeout: () => []); if (r.isEmpty && event.movie.originalTitle.trim().isNotEmpty && event.movie.originalTitle.trim() != q1) { try { r = await loggedServiceEntry.value.searchMovies(event.movie.originalTitle.trim()).timeout(const Duration(seconds: 7), onTimeout: () => []); } catch (_) {} } return r; })();")
          mdb_old = 'add(LoadMovieDetails(movie: results.first));'
          mdb_new = "if (results.isEmpty) { emit(state.copyWith(errorMessage: 'Nie znaleziono wideo dla: ' + (event.movie.title.isNotEmpty ? event.movie.title : event.movie.originalTitle) + '. Upewnij się, że jesteś zalogowany w Ustawieniach.', isLoaded: true)); return; } add(LoadMovieDetails(movie: results.first));"
