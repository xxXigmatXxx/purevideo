          old_run = "SeriousPython.run('app/app.zip')"
          new_run = "try { final sd = await getApplicationSupportDirectory(); final fd = Directory('${sd.path}/flet/app'); if (await fd.exists()) { final hf = File('${fd.path}/.hash'); final ch = (await rootBundle.loadString('app/app.zip.hash')).trim(); final sh = (await hf.exists()) ? (await hf.readAsString()).trim() : ''; if (ch.isNotEmpty && sh != ch) { debugPrint('Upgrading app.zip'); await fd.delete(recursive: true); } } } catch (_) {} SeriousPython.run('app/app.zip')"
          if old_run in s_main:
              s_main = "import 'dart:io';\n" + s_main.replace(old_run, new_run)
              open(p_main, 'w', encoding='utf-8').write(s_main)

          print('ALL 7 STEPS AND APP.ZIP REBUILD COMPLETED SUCCESSFULLY!')
