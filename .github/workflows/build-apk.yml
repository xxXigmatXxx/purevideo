name: Build PureVideo APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.6
          cache: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Apply All Fixes Automatically
        run: |
          echo "=== 1. Aktualizacja LibResolveURL (VOE, Streamtape) ==="
          rm -rf resolver/LibResolveURL
          git clone --depth 1 https://github.com/Gujal00/ResolveURL.git resolver/LibResolveURL
          mkdir -p app
          python3 -c "import shutil; shutil.make_archive('app/app', 'zip', 'resolver')"

          echo "=== 2. Naprawa domeny Ekino (ekino.ws) ==="
          sed -i 's|https://ekino-tv.pl|https://ekino.ws|g' lib/core/utils/supported_enum.dart

          echo "=== 3. Naprawa okna Cloudflare dla Filmana ==="
          cat << 'EOF' > patch_cf.py
          p = 'lib/core/services/webview_service.dart'
          with open(p, 'r', encoding='utf-8') as f:
              c = f.read()
          c = c.replace('transparentBackground: true', 'transparentBackground: false')
          c = c.replace('incognito: true', 'incognito: false')
          c = c.replace('clearCache: true', 'clearCache: false')
          c = c.replace('; wv', '')
          c = c.replace('Colors.transparent', 'const Color(0xFF1E293B)')
          with open(p, 'w', encoding='utf-8') as f:
              f.write(c)
          EOF
          python3 patch_cf.py
          rm -f patch_cf.py

          echo "=== 4. Dostosowanie Android SDK i podpis debug ==="
          cat << 'EOF' > patch_gradle.py
          with open("android/app/build.gradle.kts", "r") as f:
              c = f.read()
          c = c.replace("compileSdk = 36", "compileSdk = 35")
          c = c.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
          c = c.replace('id("com.google.firebase.crashlytics")', '// removed crashlytics')
          c = c.replace('ndkVersion = "28.2.13676358"', '// removed ndk')
          c = c.replace('signingConfig = signingConfigs.getByName("release")', 'signingConfig = signingConfigs.getByName("debug")')
          c = c.replace('if (keystoreProperties.containsKey("storeFile")) {', 'if (true) {')
          with open("android/app/build.gradle.kts", "w") as f:
              f.write(c)
          EOF
          python3 patch_gradle.py
          rm -f patch_gradle.py
          sed -i '/crashlytics/d' android/settings.gradle.kts

      - name: Install Flutter Packages
        run: flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

      - name: Upload APK as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PureVideo-Fixed-APK
          path: build/app/outputs/flutter-apk/*.apk
